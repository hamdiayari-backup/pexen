name: pexen

services:
  postgres:
    image: postgres:17-alpine
    container_name: pexen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pexen
      POSTGRES_USER: pexen
      POSTGRES_PASSWORD: ${PEXEN_DB_PASSWORD:?PEXEN_DB_PASSWORD manquant}
      TZ: Europe/Paris
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pexen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pexen -d pexen"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pexen_pgdata:
